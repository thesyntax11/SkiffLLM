# Local, loopback-bound SkiffLLM server.
#
# Uses the server topology from docs/ENTERPRISE.md. Models are read-only
# mounted; sessions are held in a named volume. The service is only exposed to
# the host loopback, not to the network, so a TLS reverse proxy and rate
# limiting must be added in front before it is ever exposed beyond localhost.
#
#   docker compose up -d --build

services:
  llm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: llm:local
    restart: unless-stopped
    # Bind to host loopback only. Change to "8080:8080" only if you truly need
    # listener access from the network (and then protect it with --api-key).
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Read at runtime; never commit a real key.
      LLM_SERVER_KEY: "${LLM_SERVER_KEY:?set LLM_SERVER_KEY in the environment or .env}"
    volumes:
      - ./models:/models:ro
      - llm-sessions:/srv/llm/sessions
    command:
      - --model
      - /models/model-q4_k_m.gguf
      - --serve
      - --host
      - 0.0.0.0
      - --port
      - 8080
      - --api-key
      - "${LLM_SERVER_KEY}"
      - --history
      - /srv/llm/sessions
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  llm-sessions:
