# Enterprise example configuration for SkiffLLM.
# This file only uses keys the runtime actually parses. Replace the paths and
# the API key before use, then validate with `llm --config <path>
# --show-config`.

# ---- Model supply chain -------------------------------------------------
# Bring your own GGUF. The runtime never downloads a model.
model=/srv/llm/models/qwen2.5-1.5b-instruct-q4_k_m.gguf
model-dir=/srv/llm/models
history=/srv/llm/sessions

# ---- Session / prompt setup ---------------------------------------------
session=main
profile=balanced
system=You are SkiffLLM, an offline local assistant for an isolated environment.
chat-template=chatml
warmup=yes

# ---- Local server (loopback only by default) ----------------------------
# A non-loopback listener is reachable only when you also set api-key and put a
# TLS reverse proxy with rate limiting in front. There is no internal rate
# limiter and generation is serialized behind one mutex.
serve=yes
host=127.0.0.1
port=8080
# Read the key from the environment at launch rather than committing it here.
# api-key=set-me-from-your-secret-store

# ---- Context and determinism --------------------------------------------
ctx=8192
batch=512
ubatch=256
threads=8
gpu-layers=0
n-predict=768
auto-trim=yes
reserve-ctx=192
seed=42

# ---- Sampling -----------------------------------------------------------
temp=0.40
top-p=0.90
top-k=40
min-p=0.05
typical=0.0
repeat-penalty=1.10
repeat-last-n=64

# ---- Hardware -----------------------------------------------------------
flash-attn=no
numa=no
kv-offload=yes
n-keep=0

# ---- Output -------------------------------------------------------------
color=no
verbose=no
context-bar=no
backend-info=no
