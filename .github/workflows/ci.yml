name: CI

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-15
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Cache ccache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-cmake-v1

      - name: Configure
        run: |
          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          if [ "$RUNNER_OS" = "Linux" ]; then
            export CC="ccache gcc"
            export CXX="ccache g++"
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSKIFFLLM_BUILD_TESTS=ON \
            -DSKIFFLLM_WARNINGS_AS_ERRORS=OFF
        shell: bash

      - name: Build
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            if cmake --build build --config Release 2>&1 | tee build.log; then
              :
            else
              status="${PIPESTATUS[0]}"
              tail -n 60 build.log | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit "${status}"
            fi
          else
            if cmake --build build --config Release -j 4 2>&1 | tee build.log; then
              :
            else
              status="${PIPESTATUS[0]}"
              tail -n 60 build.log | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit "${status}"
            fi
          fi
        shell: bash

      - name: Test
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ctest --test-dir build --build-config Release --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi
        shell: bash

      - name: Smoke test
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/Release/skiffllm --version
            ./build/Release/skiffllm --doctor
          else
            ./build/skiffllm --version
            ./build/skiffllm --doctor
          fi
        shell: bash

      - name: Prepare desktop artifact
        if: always()
        shell: bash
        run: |
          mkdir -p distribution
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/Release/skiffllm.exe distribution/skiffllm.exe
          else
            cp build/skiffllm distribution/skiffllm
          fi

      - name: Upload desktop artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: distribution/skiffllm*
          retention-days: 7
          if-no-files-found: error

  sanitize:
    name: Sanitizers (ASan/UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Configure with sanitizers
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSKIFFLLM_BUILD_TESTS=ON \
            -DSKIFFLLM_WARNINGS_AS_ERRORS=OFF \
            -DSKIFFLLM_ENABLE_SANITIZERS=ON
        shell: bash

      - name: Build
        run: cmake --build build --config Debug -j 4
        shell: bash

      - name: Test
        run: ctest --test-dir build --output-on-failure
        shell: bash

      - name: Smoke test
        run: |
          ./build/skiffllm --version
          ./build/skiffllm --doctor >/dev/null
          ./build/skiffllm --backend-info >/dev/null
        shell: bash

  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install CMake/NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Build debug APK
        run: |
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug
        shell: bash

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  ios:
    name: iOS (simulator build)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project and XCFramework
        run: bash scripts/ios-setup.sh

      - name: Build iOS simulator
        run: |
          xcodebuild \
            -project ios/SkiffLLM.xcodeproj \
            -scheme SkiffLLM \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            build
        shell: bash

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios-build/Build/Products/Debug-iphonesimulator/SkiffLLM.app
          retention-days: 7
          if-no-files-found: error

  lint:
    name: Docs and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check relative Markdown links
        run: bash scripts/check-links.sh

      - name: Check naming and release packaging
        run: |
          bash scripts/check-naming.sh
          bash -n scripts/release.sh
          bash -n scripts/check-naming.sh
          bash -n scripts/package-ios.sh
        shell: bash

      - name: Check shell and Python scripts
        run: |
          for script in scripts/*.sh; do
            bash -n "${script}"
          done
          python3 -m py_compile scripts/api_client.py scripts/model_fetch.py
          python3 scripts/model_fetch.py --list >/dev/null
          python3 scripts/model_fetch.py --help >/dev/null
          python3 scripts/api_client.py --help >/dev/null
        shell: bash

      - name: Check C++ formatting
        run: |
          python3 -m pip install --break-system-packages "clang-format==17.0.6"
          bash scripts/check-format.sh
        shell: bash

      - name: Check version consistency
        run: |
          EXPECTED_VERSION="$(sed -n 's/project(SkiffLLM VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)"
          test -n "${EXPECTED_VERSION}"
          grep -q "SKIFFLLM_VERSION \"${EXPECTED_VERSION}\"" src/main.cpp
          grep -q "SkiffLLM ${EXPECTED_VERSION}" docs/skiffllm.1
          grep -q "versionName = \"${EXPECTED_VERSION}\"" android/app/build.gradle.kts
          echo "Version ${EXPECTED_VERSION} is consistent."
        shell: bash
