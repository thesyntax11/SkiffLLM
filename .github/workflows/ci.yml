name: CI

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - "arena/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-14
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Cache ccache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-cmake-v1

      - name: Configure
        run: |
          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          if [ "$RUNNER_OS" = "Linux" ]; then
            export CC="ccache gcc"
            export CXX="ccache g++"
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSKIFFLLM_BUILD_TESTS=ON
        shell: bash

      - name: Build
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --build build --config Release
          else
            cmake --build build --config Release -j 4
          fi
        shell: bash

      - name: Test
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ctest --test-dir build --build-config Release --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi
        shell: bash

      - name: Smoke test
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/Release/skifflm --version
            ./build/Release/skifflm --doctor
          else
            ./build/skifflm --version
            ./build/skifflm --doctor
          fi
        shell: bash

  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install CMake/NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Build debug APK
        run: |
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug
        shell: bash

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS (simulator build)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project and XCFramework
        run: bash scripts/ios-setup.sh

      - name: Build iOS simulator
        run: |
          xcodebuild \
            -project ios/SkiffLLM.xcodeproj \
            -scheme SkiffLLM \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
        shell: bash

  lint:
    name: Docs and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check relative Markdown links
        run: bash scripts/check-links.sh

      - name: Check shell and Python scripts
        run: |
          bash -n scripts/release.sh
          bash -n scripts/ci-local.sh
          python3 -m py_compile scripts/model_fetch.py scripts/api_client.py
          python3 scripts/model_fetch.py --list >/dev/null
          python3 scripts/model_fetch.py --help >/dev/null
          python3 scripts/api_client.py --help >/dev/null
        shell: bash

      - name: Check C++ formatting
        run: |
          if ! command -v clang-format >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang-format
          fi
          bash scripts/check-format.sh
        shell: bash

      - name: Check version consistency
        run: |
          EXPECTED_VERSION="$(sed -n 's/project(SkiffLLM VERSION \([0-9][0-9.]*\)).*/\1/p' CMakeLists.txt)"
          test -n "${EXPECTED_VERSION}"
          grep -q "SKIFFLLM_VERSION \"${EXPECTED_VERSION}\"" src/main.cpp
          grep -q "SkiffLLM ${EXPECTED_VERSION}" docs/skifflm.1
          grep -q "versionName = \"${EXPECTED_VERSION}\"" android/app/build.gradle.kts
          echo "Version ${EXPECTED_VERSION} is consistent."
        shell: bash
